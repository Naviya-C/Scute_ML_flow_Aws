# Phase 1: API + GPU worker on one G4 VM. Data lives in AWS: RDS (Postgres+pgvector) and S3.
#   cp .env.example .env     (DATABASE_URL -> RDS, S3_INCOMING_BUCKET, S3_ACCEPTED_BUCKET, AWS_REGION, API_KEYS, ADMIN_KEYS, IMAGE_TAG)
#   aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin 412161755472.dkr.ecr.ap-southeast-2.amazonaws.com
#   docker compose pull && docker compose up -d      (IMAGE_TAG = a commit SHA that CI pushed to ECR)
# AWS credentials come from the VM's IAM instance profile; do not put access keys in .env.
#
# No RDS yet? Run a throwaway local Postgres instead:
#   DATABASE_URL=postgresql://turtle:turtle@db:5432/turtle docker compose --profile localdb up -d

services:
  db:
    profiles: ["localdb"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: turtle
      POSTGRES_PASSWORD: turtle
      POSTGRES_DB: turtle
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turtle -d turtle"]
      interval: 5s
      retries: 10

  migrate:
    image: 412161755472.dkr.ecr.ap-southeast-2.amazonaws.com/seaturtle/ml-api:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA pushed by CI}
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    restart: on-failure       # retries while the database is still coming up

  api:
    image: 412161755472.dkr.ecr.ap-southeast-2.amazonaws.com/seaturtle/ml-api:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA pushed by CI}
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      WORKER_URL: http://worker:9000
    ports:
      - "8000:8000"
    depends_on:
      migrate: {condition: service_completed_successfully}
      worker: {condition: service_healthy}
    restart: unless-stopped

  # HTTPS in front of the API. With a bare IP the certificate is self-signed (Caddy's internal CA).
  # Swap the address in Caddyfile for a domain and Caddy gets a real Let's Encrypt certificate.
  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
    restart: unless-stopped

  worker:
    image: 412161755472.dkr.ecr.ap-southeast-2.amazonaws.com/seaturtle/ml-worker:${IMAGE_TAG:?set IMAGE_TAG to a commit SHA pushed by CI}
    environment:
      DATABASE_URL: ${DATABASE_URL}
      S3_INCOMING_BUCKET: ${S3_INCOMING_BUCKET}
      S3_INCOMING_PREFIX: ${S3_INCOMING_PREFIX:-incoming/}
      S3_ACCEPTED_BUCKET: ${S3_ACCEPTED_BUCKET}
      S3_ACCEPTED_PREFIX: ${S3_ACCEPTED_PREFIX:-accepted/}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      WORKER_CONCURRENCY: "4"
      REQUIRED_SLOTS: ${REQUIRED_SLOTS:-whole,left,right}
      # Trained weights, read from the WEIGHTS_DIR mount. Set a path to empty in .env to turn that
      # stage off (pass-through); then EMBED_MODEL_VERSION / SEG_MODEL_VERSION must match (see .env.example).
      DETECT_MODEL_PATH: ${DETECT_MODEL_PATH-/weights/detection_v1.pth}
      SEG_MODEL_PATH: ${SEG_MODEL_PATH-/weights/seg-yolo26n.pt}
      DETECT_MIN_CONF: ${DETECT_MIN_CONF:-0.5}
      DETECT_PAD: ${DETECT_PAD:-0.10}
      # Segmented-scute embeddings get their own version so they are never matched against the
      # old full-photo ones (dinov2-base-v1).
      EMBED_MODEL_VERSION: ${EMBED_MODEL_VERSION:-dinov2-base-seg-v1}
      SEG_MODEL_VERSION: ${SEG_MODEL_VERSION:-yolo26s-seg-scute-v1}
    volumes:
      - models:/models          # Hugging Face models (DINOv2, BioCLIP) are cached here across restarts
      - ${WEIGHTS_DIR:-./models}:/weights:ro   # detector + segmenter weights; never baked into the image
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped

volumes:
  pgdata:
  models:
  caddy_data:
